<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Message For Dhruvi ❤️</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 420px;
      width: 90%;
      position: relative;
      transition: all 0.3s ease;
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
      animation: heartBeat 1.3s infinite ease-in-out;
    }

    @keyframes heartBeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.15); }
      28% { transform: scale(1); }
      42% { transform: scale(1.15); }
      70% { transform: scale(1); }
    }

    .progress-bar {
      width: 100%;
      background-color: #f3d5d8;
      border-radius: 10px;
      height: 8px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 33%;
      background: linear-gradient(90deg, #ff758c, #ff7eb3);
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    h1 {
      color: #2d3748;
      font-size: 22px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    p {
      color: #718096;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn-option {
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      border: 2px solid #fecfef;
      border-radius: 12px;
      background: #ffffff;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-option:hover {
      border-color: #ff758c;
      background: #fff5f7;
      transform: translateY(-2px);
    }

    .proposal-buttons {
      display: none;
      justify-content: center;
      gap: 20px;
      position: relative;
      height: 50px;
      margin-top: 10px;
    }

    .action-btn {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    #yesBtn {
      background-color: #ff758c;
      color: white;
    }

    #yesBtn:hover {
      background-color: #ff5277;
      transform: scale(1.08);
    }

    #noBtn {
      background-color: #a0aec0;
      color: white;
      position: absolute;
      right: 30px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>
    
    <div class="icon" id="icon">💖</div>
    <h1 id="heading">Hey Dhruvi! Quick Question...</h1>
    <p id="subtext">Select an option to proceed!</p>
    
    <!-- Quiz Options -->
    <div class="options-grid" id="optionsGrid">
      <button class="btn-option" onclick="handleQuizAnswer(0)">🍕 Foodies who talk 24/7</button>
      <button class="btn-option" onclick="handleQuizAnswer(1)">😂 Partners in chaos & memes</button>
      <button class="btn-option" onclick="handleQuizAnswer(2)">🎮 Playing games / chatting</button>
      <button class="btn-option" onclick="handleQuizAnswer(3)">✨ All of the above!</button>
    </div>

    <!-- Final Proposal Buttons -->
    <div class="proposal-buttons" id="proposalGroup">
      <button class="action-btn" id="yesBtn">YES! 💕</button>
      <button class="action-btn" id="noBtn">NO 😜</button>
    </div>
  </div>

  <script>
    // Sound Effects
    const playSound = (type) => {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      if (type === 'click') {
        osc.frequency.value = 450;
        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.1);
      } else if (type === 'win') {
        osc.frequency.value = 650;
        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.4);
      }
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    };

    const questions = [
      {
        icon: "💖",
        heading: "Hey Dhruvi, what describes us best?",
        subtext: "Choose the most accurate answer!",
        options: [
          "🍕 Foodies who talk 24/7",
          "😂 Partners in chaos & memes",
          "🎮 Game night legends",
          "✨ All of the above!"
        ]
      },
      {
        icon: "⭐",
        heading: "Question 2: Who makes this friendship cooler?",
        subtext: "Think carefully Dhruvi...",
        options: [
          "👑 Obviously you, Dhruvi!",
          "😎 Definitely me",
          "🤝 We are equally awesome",
          "🔥 Both of us combined = Unstoppable"
        ]
      },
      {
        icon: "💌",
        heading: "Dhruvi, final question:",
        subtext: "Will you officially be my Best Friend forever?",
        options: []
      }
    ];

    let currentStep = 0;

    function handleQuizAnswer(index) {
      playSound('click');
      currentStep++;
      
      if (currentStep < questions.length - 1) {
        loadQuestion(currentStep);
      } else {
        loadProposalScreen();
      }
    }

    function loadQuestion(stepIndex) {
      const q = questions[stepIndex];
      document.getElementById('icon').innerText = q.icon;
      document.getElementById('heading').innerText = q.heading;
      document.getElementById('subtext').innerText = q.subtext;
      
      // Update Progress Bar
      const progressPercent = ((stepIndex + 1) / questions.length) * 100;
      document.getElementById('progress').style.width = progressPercent + '%';

      // Update Buttons
      const optionsGrid = document.getElementById('optionsGrid');
      optionsGrid.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => handleQuizAnswer(idx);
        optionsGrid.appendChild(btn);
      });
    }

    function loadProposalScreen() {
      const q = questions[questions.length - 1];
      document.getElementById('icon').innerText = q.icon;
      document.getElementById('heading').innerText = q.heading;
      document.getElementById('subtext').innerText = q.subtext;
      document.getElementById('progress').style.width = '100%';
      
      document.getElementById('optionsGrid').style.display = 'none';
      document.getElementById('proposalGroup').style.display = 'flex';
    }

    // Runaway "No" button logic
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');

    noBtn.addEventListener('mouseover', () => {
      playSound('click');
      const x = Math.floor(Math.random() * (window.innerWidth - 120));
      const y = Math.floor(Math.random() * (window.innerHeight - 60));
      
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    // Celebration screen when "YES" clicked
    yesBtn.addEventListener('click', () => {
      playSound('win');
      document.getElementById('icon').innerText = "💖";
      document.getElementById('heading').innerText = "YAY! IT'S OFFICIAL!";
      document.getElementById('subtext').innerText = "Love you Dhruvi! Best friends forever! 🎉✨";
      document.getElementById('proposalGroup').style.display = 'none';
      
      // Fire Confetti Animation
      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 }
      });
    });
  </script>

</body>
</html>
